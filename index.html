<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Plant vs Zombie</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;font-family:Arial,sans-serif;overflow:hidden}
#game{width:100vw;height:100vh;display:flex;flex-direction:column;background:#79bd45}
#top{height:76px;background:#254d20;color:white;display:flex;align-items:center;gap:12px;padding:8px}
#sun{background:#f5c542;color:#222;border-radius:20px;padding:10px 16px;font-weight:bold}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:bold}
#board{position:relative;flex:1;background:linear-gradient(#91d35a,#68ae3e);display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(5,1fr);gap:2px;padding:4px}
.cell{border:1px solid rgba(30,90,25,.25);position:relative}
.plant{position:absolute;inset:10%;border-radius:50%;background:#299b45;border:3px solid #176b2b;display:flex;align-items:center;justify-content:center;font-size:30px}
.zombie{position:absolute;width:48px;height:58px;border-radius:18px;background:#697b62;border:3px solid #384537;display:flex;align-items:center;justify-content:center;font-size:28px;z-index:3}
.pea{position:absolute;width:13px;height:13px;border-radius:50%;background:#b8ef38;z-index:4}
#hint{text-align:center;background:#163814;color:#fff;padding:5px;font-size:13px}
</style>
</head>
<body>
<div id="game">
  <div id="top">
    <div id="sun">☀️ <span id="sunCount">100</span></div>
    <button id="peaBtn">🌱 Đậu 50</button>
    <button id="restart">🔄</button>
  </div>
  <div id="board"></div>
  <div id="hint">Chạm một ô để trồng cây. Zombie sẽ xuất hiện từ bên phải.</div>
</div>
<script>
const board=document.getElementById('board'), sunEl=document.getElementById('sunCount');
let sun=100, plants=[], zombies=[], peas=[], gameOver=false;
const cells=[];
for(let r=0;r<5;r++)for(let c=0;c<9;c++){let d=document.createElement('div');d.className='cell';d.dataset.r=r;d.dataset.c=c;board.appendChild(d);cells.push(d)}
function setSun(n){sun=n;sunEl.textContent=sun}
cells.forEach(cell=>cell.onclick=()=>{
 if(gameOver||cell.querySelector('.plant')||sun<50)return;
 let p=document.createElement('div');p.className='plant';p.textContent='🌱';cell.appendChild(p);
 plants.push({r:+cell.dataset.r,c:+cell.dataset.c,el:p,hp:3});
 setSun(sun-50);
});
function spawn(){
 if(gameOver)return;
 let r=Math.floor(Math.random()*5), z=document.createElement('div');z.className='zombie';z.textContent='🧟';
 board.appendChild(z); zombies.push({r,x:board.clientWidth-55,el:z,hp:5});
}
function shoot(){
 plants.forEach(p=>{
  let q=document.createElement('div');q.className='pea';board.appendChild(q);
  let rect=board.getBoundingClientRect(), cell=cells[p.r*9+p.c].getBoundingClientRect();
  peas.push({r:p.r,x:cell.left-rect.left+cell.width*.65,y:cell.top-rect.top+cell.height*.45,el:q});
 });
}
function loop(){
 if(gameOver)return;
 let rect=board.getBoundingClientRect();
 zombies.forEach(z=>{z.x-=.18;z.el.style.left=z.x+'px';z.el.style.top=(z.r*board.clientHeight/5+15)+'px'});
 peas.forEach(p=>{p.x+=3;p.el.style.left=p.x+'px';p.el.style.top=p.y+'px'});
 peas.forEach((p,i)=>{
  zombies.forEach(z=>{
   if(z.r===p.r && Math.abs(p.x-z.x)<45){z.hp--;p.el.remove();peas.splice(i,1);if(z.hp<=0){z.el.remove();z.dead=true;setSun(sun+25)}}});
 });
 zombies=zombies.filter(z=>!z.dead);
 if(zombies.some(z=>z.x<0)){gameOver=true;alert('Zombie đã vào nhà!');}
 requestAnimationFrame(loop);
}
document.getElementById('restart').onclick=()=>location.reload();
setInterval(spawn,4000);setInterval(shoot,1800);loop();
</script>
</body>
</html>

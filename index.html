<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Plant vs Zombie</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#111;
 font-family:Arial,sans-serif;
 overflow:hidden
}

#game{
 width:100vw;
 height:100vh;
 display:flex;
 flex-direction:column;
 background:#79bd45
}

#top{
 height:72px;
 min-height:72px;
 background:linear-gradient(#3f702e,#254d20);
 color:white;
 display:flex;
 align-items:center;
 gap:10px;
 padding:7px 10px;
 border-bottom:4px solid #173512
}

#sun{
 background:linear-gradient(#ffe77a,#f5c542);
 color:#222;
 border:2px solid #b98a12;
 border-radius:22px;
 padding:9px 15px;
 font-weight:bold
}

button{
 border:2px solid #214d1b;
 border-radius:10px;
 padding:8px 12px;
 font-weight:bold;
 background:linear-gradient(#fff,#d7e7c9)
}

.plantBtn{
 min-width:78px;
 line-height:1.05
}

.plantBtn.selected{
 outline:3px solid #ffe36b
}

.plantBtn small{
 font-size:10px
}

#board{
 position:relative;
 flex:1;
 min-height:0;
 background:linear-gradient(#91d35a,#68ae3e);
 display:grid;
 grid-template-columns:repeat(9,1fr);
 grid-template-rows:repeat(5,1fr);
 gap:3px;
 padding:5px;
 overflow:hidden
}

.cell{
 border:1px solid rgba(30,90,25,.25);
 position:relative;
 background:rgba(117,183,67,.22);
 border-radius:3px
}

.cell:nth-child(odd){
 background:rgba(101,165,58,.20)
}

.plant{
 position:absolute;
 inset:5%;
 display:flex;
 align-items:center;
 justify-content:center;
 z-index:2
}

.plant img{
 width:100%;
 height:100%;
 object-fit:contain;
 pointer-events:none
}

.zombie{
 position:absolute;
 width:52px;
 height:64px;
 border-radius:18px;
 background:#697b62;
 border:3px solid #384537;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:32px;
 z-index:3
}

.pea{
 position:absolute;
 width:13px;
 height:13px;
 border-radius:50%;
 background:#b8ef38;
 border:2px solid #4d9e22;
 z-index:4
}

#hint{
 text-align:center;
 background:#163814;
 color:white;
 padding:5px;
 font-size:13px
}

@media (orientation:portrait){
 #game{
  transform:rotate(90deg);
  transform-origin:center center;
  width:100vh;
  height:100vw;
  position:absolute;
  left:50%;
  top:50%;
  margin-left:-50vh;
  margin-top:-50vw
 }
}

@media(max-width:700px){
 #top{
  height:62px;
  min-height:62px
 }

 button{
  padding:7px 9px;
  font-size:12px
 }

 #sun{
  padding:7px 10px;
  font-size:13px
 }
}
</style>
</head>

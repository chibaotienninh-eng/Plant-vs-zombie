<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plant vs Zombie</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    overflow:hidden;
    background:#72bd3d;
    font-family:Arial,sans-serif;
}

#game{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* THANH TRÊN */
#top{
    height:70px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px;
    background:linear-gradient(#4d8b32,#28551c);
    border-bottom:3px solid #1d4014;
}

#sun{
    min-width:80px;
    height:52px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#ffd83d;
    border:3px solid #9c7711;
    font-weight:bold;
    font-size:18px;
}

.card{
    height:52px;
    min-width:85px;
    border:2px solid #456b32;
    border-radius:9px;
    background:#f3f3df;
    font-weight:bold;
}

.card.selected{
    outline:3px solid #ffe34a;
}

#restart{
    height:50px;
    width:50px;
    font-size:20px;
}

/* SÂN */
#board{
    flex:1;
    min-height:0;
    margin:5px;
    padding:4px;

    display:grid;
    grid-template-columns:repeat(9,1fr);
    grid-template-rows:repeat(5,1fr);

    gap:2px;
